name: Agent Task Review

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-task-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || vars.AGENT_REVIEW_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.NELSON_O_REVIEW_TOKEN }}
    steps:
      - name: Verify review identity
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure NELSON_O_REVIEW_TOKEN for nelson-o with contents and issues read access.' >&2
            exit 1
          fi
          test "$(gh api user --jq .login)" = 'nelson-o'
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.NELSON_O_REVIEW_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - name: Propose backlog review
        run: bun scripts/review-agent-tasks.ts
